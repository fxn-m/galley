id: automated-submission
statement: Automated upload, email submission, or delivery confirmation is not a requirement.
rationale: >
  The first path ends at a user-controlled iOS Files share handoff. It adds no credentials,
  private endpoints, watcher, or claim that Amazon received or converted the artifact.
provenance:
  - claim: Amazon documents user-facing Send to Kindle channels and no public personal-document API.
    kind: spec-document
    date: "2026-08-27"
    ref: https://digprjsurvey.amazon.com/csad/help/node/G5WYD9SAF7PGXRNA
  - claim: Galley stops at the iOS handoff and does not automate submission in the first slice.
    kind: product-decision
    date: "2026-08-27"
  - claim: >
      The first observed Files-to-Kindle share completed without troublesome delay, so one
      successful run does not earn a credentialled or automated submission surface.
    kind: product-decision
    date: "2026-08-27"
